<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}} · {{BOOK}}</title>
<style>{{CSS}}</style>
</head>
<body>
<section class="cover">
  <div class="cover-top">
    <span class="label">{{BOOK}}</span>
    <span class="date">{{DATE}}</span>
  </div>
  <div class="cover-middle">
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{FORMAT}} · {{TOTAL}} · {{SECTIONS}}</p>
  </div>
  <div class="cover-bottom">
    <p class="mix-title">{{MIX_LABEL}}</p>
    <div class="bar">{{BAR}}</div>
    <ul class="legend">{{LEGEND}}</ul>
    <p class="source-note">{{SOURCE_LABEL}}: {{SOURCE}}</p>
    {{COVER_GUIDE}}
  </div>
</section>

{{CONTENTS_PAGE}}

{{BODY}}
</body>
</html>
