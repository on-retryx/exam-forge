<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="forge-token" content="{{TOKEN}}">
<title>Exam Forge Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><h1>EXAM FORGE <em>STUDIO</em></h1></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="office" aria-selected="true" data-i18n="tab_office"></button>
    <button role="tab" data-tab="job" aria-selected="false" data-i18n="tab_job"></button>
    <button role="tab" data-tab="settings" aria-selected="false" data-i18n="tab_settings"></button>
  </nav>
  <div class="tools">
    <select id="run" aria-label="Job"></select>
    <button id="lang" class="chip" aria-label="Language"></button>
    <div id="theme" class="segment" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-choice="light" data-i18n="theme_light"></button>
      <button type="button" role="radio" data-theme-choice="dark" data-i18n="theme_dark"></button>
      <button type="button" role="radio" data-theme-choice="auto" data-i18n="theme_auto"></button>
    </div>
  </div>
</header>

<main id="office-tab">
  <section class="stage">
    <canvas id="office" role="img"></canvas>
    <div class="stage-bar">
      <p id="banner" class="banner" hidden></p>
      <button id="open-console" class="console-btn" data-i18n="open_console"></button>
    </div>
  </section>
  <aside class="side">
    <div class="status">
      <p id="phase" class="phase"></p>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div>
      <dl class="stats">
        <div><dt data-i18n="stat_verified"></dt><dd id="s-verified">0</dd></div>
        <div><dt data-i18n="stat_rewrites"></dt><dd id="s-rewrites">0</dd></div>
        <div><dt data-i18n="stat_chunks"></dt><dd id="s-chunks">0</dd></div>
        <div><dt data-i18n="stat_cost"></dt><dd id="s-cost">–</dd></div>
      </dl>
    </div>
    <div id="books-box" class="books" hidden><h2 data-i18n="books"></h2><ul id="books"></ul></div>
    <div class="team"><h2 data-i18n="team"></h2><ul id="team"></ul></div>
    <div class="feed"><h2 data-i18n="updates"></h2><ol id="feed" aria-live="polite"></ol></div>
  </aside>
</main>

<main id="job-tab" hidden>
  <p id="job-session" class="intro" role="status"></p>
  <form id="job" autocomplete="off">
    <fieldset>
      <legend data-i18n="job_sources"></legend>
      <div class="field wide">
        <ul id="job-pdfs"></ul>
        <div id="job-drop" class="drop">
          <p data-i18n="job_drop"></p>
          <button type="button" id="job-pick" class="chip primary" data-i18n="job_pick"></button>
          <p id="job-upload" role="status"></p>
        </div>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="job_book"></legend>
      <div class="field"><div><label for="job-format" data-i18n="job_format"></label></div><div class="control"><select id="job-format"></select></div></div>
      <div class="field" id="job-options-row"><div><label for="job-options" data-i18n="job_options"></label></div><div class="control"><select id="job-options"></select></div></div>
      <div class="field"><div><label for="job-answers" data-i18n="job_answers"></label></div><div class="control"><select id="job-answers"></select></div></div>
      <div class="field" id="job-merge-row"><div><label for="job-merge" data-i18n="job_merge"></label><p data-i18n="job_merge_help"></p></div><div class="control"><input type="checkbox" id="job-merge"></div></div>
    </fieldset>
    <fieldset>
      <legend data-i18n="job_guidance"></legend>
      <div class="field"><div><label for="job-notes" data-i18n="job_notes"></label><p data-i18n="job_notes_help"></p></div><div class="control"><textarea id="job-notes" maxlength="4000"></textarea></div></div>
      <div class="field"><div><label for="job-field" data-i18n="job_field"></label><p data-i18n="job_field_help"></p></div><div class="control"><input type="text" id="job-field" maxlength="100"></div></div>
    </fieldset>
    <div class="job-actions">
      <p id="job-error" class="err" role="alert"></p>
      <button type="button" id="job-cancel" class="chip" data-i18n="job_cancel"></button>
      <button type="submit" id="job-start" class="chip primary" data-i18n="job_start"></button>
    </div>
  </form>
</main>

<main id="settings-tab" hidden>
  <p class="intro" data-i18n="settings_intro"></p>
  <form id="settings" autocomplete="off"></form>
</main>

<dialog id="console" aria-labelledby="console-title">
  <header class="console-head">
    <h2 id="console-title" data-i18n="console_title"></h2>
    <span id="console-count"></span>
    <button id="console-close" class="chip" data-i18n="close"></button>
  </header>
  <div class="console-body">
    <ul id="agents" role="listbox" tabindex="0" aria-labelledby="console-title"></ul>
    <section class="agent-view" aria-live="polite">
      <div class="agent-top">
        <canvas id="agent-face" width="44" height="44" aria-hidden="true"></canvas>
        <div>
          <h3 id="agent-name"></h3>
          <p id="agent-task"></p>
          <dl class="agent-facts">
            <div><dt data-i18n="fact_status"></dt><dd id="agent-status"></dd></div>
            <div><dt data-i18n="fact_model"></dt><dd id="agent-model"></dd></div>
            <div><dt data-i18n="fact_chunk"></dt><dd id="agent-chunk"></dd></div>
          </dl>
        </div>
      </div>
      <h4 data-i18n="agent_log"></h4>
      <ol id="agent-log"></ol>
      <footer class="agent-nav">
        <button id="agent-prev" class="chip" data-i18n="prev"></button>
        <button id="agent-next" class="chip" data-i18n="next"></button>
        <button id="agent-locate" class="chip primary" data-i18n="locate"></button>
      </footer>
    </section>
  </div>
</dialog>

<dialog id="browse" aria-labelledby="browse-title">
  <header class="console-head">
    <h2 id="browse-title" data-i18n="browse_title"></h2>
    <button type="button" id="browse-close" class="chip" data-i18n="close"></button>
  </header>
  <div id="browse-places" class="browse-places"></div>
  <form id="browse-go" class="browse-bar" autocomplete="off">
    <button type="button" id="browse-up" class="chip" data-i18n="browse_up"></button>
    <input type="text" id="browse-path" data-i18n-label="browse_path" spellcheck="false">
    <button type="submit" class="chip" data-i18n="browse_go"></button>
  </form>
  <ul id="browse-list"></ul>
  <footer class="browse-foot">
    <p id="browse-error" class="err" role="alert"></p>
    <span id="browse-count"></span>
    <button type="button" id="browse-here" class="chip" data-i18n="browse_here"></button>
    <button type="button" id="browse-add" class="chip primary" data-i18n="browse_add"></button>
  </footer>
</dialog>

<div id="drop-veil" popover="manual" aria-hidden="true"><p data-i18n="drop_veil"></p></div>

<dialog id="ask" aria-labelledby="ask-text">
  <h2 data-i18n="ask_title"></h2>
  <p id="ask-text"></p>
  <div id="ask-options"></div>
  <p id="ask-error" class="err" role="alert"></p>
</dialog>

<script src="/i18n.js"></script>
<script src="/font.js"></script>
<script src="/sprites.js"></script>
<script src="/office.js"></script>
<script src="/app.js"></script>
</body>
</html>
